<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WSK Tool gör korta, ambient, abstrakta klipp.">
    <title>WSK Tool</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="stage">
        <p class="empty" id="empty">Läser bilden…</p>
        <canvas id="frame" width="1920" height="1080" aria-label="Förhandsvisning av klippet" hidden></canvas>
    </main>

    <aside>
        <p class="logo">WSK</p>
        <p class="credit">Abstract video TOOL created for WSK by ActsofService</p>

        <section class="params" id="params" hidden>
            <div class="param">
                <p class="param-label">Färger</p>
                <div class="swatches" id="swatches" role="group" aria-label="Färger i klippet"></div>
                <input id="hex" class="hex" type="text" spellcheck="false" autocapitalize="off" autocomplete="off" maxlength="7" aria-label="Hexkod för vald färg" placeholder="#hex">
                <p class="hint">Klicka på en färg och skriv en hexkod</p>
            </div>
            <div class="param">
                <p class="param-label">Antal</p>
                <div class="lengths" id="counts" role="group" aria-label="Antal färger"></div>
            </div>
            <div class="param row">
                <button type="button" id="ground-open">Bakgrund</button>
                <input id="ground-hex" class="hex" type="text" spellcheck="false" autocapitalize="off" autocomplete="off" maxlength="7" aria-label="Hexkod för bakgrund" placeholder="#hex">
                <button type="button" id="ground-chip" class="chip" aria-label="Bakgrundsfärg"></button>
                <input id="ground" class="picker" type="color" value="#f3f4ea" tabindex="-1">
            </div>
            <div class="param">
                <p class="param-label">Tempo</p>
                <div class="lengths" id="tempos" role="group" aria-label="Tempo">
                    <button type="button" data-tempo="0.55">Långsamt</button>
                    <button type="button" data-tempo="1" aria-pressed="true">Medel</button>
                    <button type="button" data-tempo="1.6">Snabbt</button>
                </div>
            </div>
            <div class="lengths" role="group" aria-label="Längd på klippet">
                <button type="button" data-length="6">6 s</button>
                <button type="button" data-length="10" aria-pressed="true">10 s</button>
                <button type="button" data-length="15">15 s</button>
                <button type="button" data-length="30">30 s</button>
                <button type="button" data-length="60">1 min</button>
                <button type="button" data-length="120">2 min</button>
                <button type="button" data-length="300">5 min</button>
                <button type="button" data-length="600">10 min</button>
            </div>
            <div class="param">
                <p class="param-label">Format</p>
                <div class="lengths" id="formats" role="group" aria-label="Filformat">
                    <button type="button" data-format="webm" aria-pressed="true">WebM</button>
                    <button type="button" data-format="mp4">MP4</button>
                </div>
            </div>
            <button type="button" id="photo" aria-pressed="false">Bild i början</button>
            <button type="button" id="loop" aria-pressed="false">Loop</button>
        </section>

        <div class="tools">
            <button type="button" class="text" id="swap">Byt bild</button>
            <button type="button" class="text" id="still" disabled>Stillbild</button>
            <button type="button" class="generate" id="generate" disabled>Generera klipp</button>
            <a class="download" id="download" hidden download="wsk-klipp.webm">Ladda ner</a>
        </div>

        <p class="status" id="status" aria-live="polite"></p>
    </aside>

    <input class="file" id="file" type="file" accept="image/png,image/webp,image/jpeg">

    <script src="embedded.js"></script>
    <script src="mp4-muxer.js"></script>
    <script src="clip.js"></script>
</body>
</html>
